<style>
/* Layout concept: full-bleed pixel canvas, HUD and controls float above it, shops open as bottom sheets. */
:root{--bg:#0d1a14;--panel:#15291f;--panel2:#1d3a2a;--line:#376148;--fg:#eef5df;--mut:#a3bda6;--acc:#f2b84b;--accd:#8a5a10;--red:#e5484d;--grn:#7bd36a;--blu:#4fc3f7;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 "Pixelify Sans",ui-monospace,Menlo,Consolas,monospace;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg)}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%)}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#hud,#controls,#prompt,#dinfo{pointer-events:auto}
#hud{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card{background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px #06100a,0 6px 0 2px rgba(0,0,0,.45);border-radius:4px}
.hudc{padding:8px 10px;min-width:168px;max-width:62vw;display:grid;gap:5px}
.hrow{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.hrow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:14px;background:#08130d;border:2px solid #06100a;box-shadow:0 0 0 1px var(--line)}
.bar i{display:block;height:100%;width:0;transition:width .15s}
.bar.hp i{background:linear-gradient(#ff6b6f,#c9353b)}
.bar.xp{height:7px}.bar.xp i{background:var(--blu)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;text-shadow:0 1px 0 #000}
.gold{color:var(--acc)}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:8px 14px;background:var(--acc);color:#2a1a06;border:2px solid #2a1a06;border-radius:3px;box-shadow:0 3px 0 var(--accd);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accd)}
.btn.ghost{background:var(--panel2);color:var(--fg);border-color:var(--line);box-shadow:0 3px 0 #08130d}
.btn.red{background:var(--red);color:#fff;border-color:#4a0f12;box-shadow:0 3px 0 #7a1c20}
.btn.sm{padding:6px 10px;font-size:13px;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
#controls{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:12px;pointer-events:none}
#controls>*{pointer-events:auto}
#stick{width:132px;height:132px;border-radius:50%;background:rgba(10,20,15,.45);border:2px solid rgba(255,255,255,.25);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(242,184,75,.88);border:3px solid #2a1a06}
.acts{display:flex;gap:10px;align-items:flex-end}
.act{width:60px;height:60px;border-radius:50%;border:3px solid #2a1a06;background:var(--acc);color:#2a1a06;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 4px 0 var(--accd);touch-action:none;cursor:pointer}
.act.big{width:76px;height:76px;font-size:15px}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accd)}
.act.blue{background:var(--blu);box-shadow:0 4px 0 #1a6f94}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:178px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#prompt b{color:var(--acc)}
#dinfo{align-self:center;margin-top:6px;padding:4px 12px;font-size:13px;background:rgba(8,16,12,.8);border:2px solid var(--line)}
#toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);max-width:min(92%,440px);text-align:center;padding:8px 14px;background:#0a1510;border:2px solid var(--acc);color:var(--fg);opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
.screen{position:absolute;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;background:rgba(7,14,10,.64);z-index:10}
.screen .card{width:min(420px,100%);padding:20px}
.logo{margin:0 0 4px;font-size:36px;letter-spacing:1px;color:var(--acc);text-shadow:0 3px 0 #6a3f0a,0 0 18px rgba(242,184,75,.35);text-align:center;line-height:1}
.sub{text-align:center;color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;font-family:inherit;font-size:14px;font-weight:600;padding:7px 4px;background:var(--panel2);color:var(--mut);border:2px solid var(--line);cursor:pointer;border-radius:3px}
.tab.on{background:var(--acc);color:#2a1a06;border-color:#2a1a06}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
input[type=text],input[type=password]{width:100%;padding:10px;background:#0a1510;color:var(--fg);border:2px solid var(--line);font:inherit;border-radius:3px;-webkit-user-select:text;user-select:text}
.err{color:#ff8a8e;min-height:18px;font-size:13px;margin:2px 0 8px}
.note{color:var(--mut);font-size:12px;text-align:center;margin:10px 0 0}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.gcard{padding:8px;border:2px solid var(--line);background:var(--panel2);display:grid;justify-items:center;gap:4px;cursor:pointer;font:inherit;color:inherit;border-radius:3px}
.gcard.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accd)}
.gcard canvas,.pv{width:96px;height:112px;image-rendering:pixelated}
.tones{display:flex;gap:8px;margin-bottom:12px}
.tone{width:36px;height:36px;border:3px solid #06100a;cursor:pointer;padding:0}
.tone.on{outline:3px solid var(--acc)}
#sheet{position:absolute;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-end;padding:0 16px 12px;background:rgba(5,10,8,.62)}
@media(min-width:700px){#sheet{align-items:center;padding-bottom:0}}
.sc{width:min(560px,100%);max-height:88%;display:flex;flex-direction:column}
.sh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid var(--line)}
.sh h2{flex:1;margin:0;font-size:17px;color:var(--acc);min-width:0}
#sheetG{color:var(--acc);font-size:14px;white-space:nowrap}
#sheetB{padding:12px;overflow:auto;min-height:0}
.row{display:flex;gap:10px;align-items:center;padding:8px;border:2px solid var(--line);background:var(--panel2);margin-bottom:8px;border-radius:3px}
.ic{font-size:24px;width:36px;text-align:center;flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:15px}
.rt small{display:block;color:var(--mut);font-size:12px}
.sw{display:inline-block;width:12px;height:12px;border:2px solid #06100a;margin-right:3px;vertical-align:-2px}
.empty{color:var(--mut);text-align:center;padding:18px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--mut)}
.stat{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pond{height:120px;position:relative;overflow:hidden;border:2px solid #06100a;background:linear-gradient(#2fb8b0,#1f9e9a 55%,#177b82);margin-bottom:10px}
.pond .line{position:absolute;left:50%;top:0;width:2px;height:52%;background:rgba(255,255,255,.7)}
.bob{position:absolute;left:50%;top:50%;width:14px;height:14px;margin-left:-7px;background:var(--red);border:2px solid #fff;border-radius:50%}
.bob.wait{animation:bob 1.4s ease-in-out infinite}
.bob.bite{animation:dunk .18s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes dunk{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
.fmsg{text-align:center;min-height:42px;margin-bottom:10px}
#fade{position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
@media(prefers-reduced-motion:reduce){.bob.wait,.bob.bite{animation:none}#fade{transition:none}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="vig" hidden></div>

  <div id="ui" hidden>
    <div id="hud">
      <div class="card hudc">
        <div class="hrow"><b id="hName">-</b><span id="hDay"></span></div>

        <div class="hrow"><span id="hGold" class="gold"></span></div>
      </div>
      <div>
        <button id="menuBtn" class="btn ghost" type="button">Menu</button>
        <button id="exitBtn" class="btn ghost" type="button" hidden>Keluar</button>
      </div>
    </div>
    <div id="dinfo" class="card" hidden></div>
    <div id="prompt" class="card" hidden></div>
    <div id="toast"></div>
    <div id="controls">
      <div id="stick"><i id="knob"></i></div>
      <div class="acts">
        <button id="btnI" class="act blue" type="button" hidden>Item</button>
        <button id="btnB" class="act big" type="button" hidden>Serang</button>
        <button id="btnA" class="act big" type="button">Aksi</button>
      </div>
    </div>
  </div>

  <section id="auth" class="screen">
    <div class="card">
      <h1 class="logo">Lembah Akar</h1>
      <p class="sub">Berkebun, memancing, dan menjelajah dungeon.</p>
      <div class="tabs">
        <button class="tab on" id="tLogin" type="button">Masuk</button>
        <button class="tab" id="tReg" type="button">Daftar</button>
      </div>
      <div class="field"><label for="iUser">Nama akun</label><input id="iUser" type="text" autocomplete="username" maxlength="16" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="iPass">Kata sandi</label><input id="iPass" type="password" autocomplete="current-password" maxlength="40"></div>
      <div class="field" id="fPass2" hidden><label for="iPass2">Ulangi kata sandi</label><input id="iPass2" type="password" autocomplete="new-password" maxlength="40"></div>
      <div class="err" id="authErr" role="alert"></div>
      <button class="btn" id="authGo" type="button" style="width:100%">Masuk</button>
      <p class="note">Akun dan progres tersimpan di perangkat ini.</p>
    </div>
  </section>

  <section id="create" class="screen" hidden>
    <div class="card">
      <h1 class="logo" style="font-size:26px">Buat Karakter</h1>
      <p class="sub">Pilih tokoh dan beri nama.</p>
      <div class="gender">
        <button class="gcard on" id="gF" type="button"><canvas id="pF" width="48" height="56"></canvas><b>Cewek</b></button>
        <button class="gcard" id="gM" type="button"><canvas id="pM" width="48" height="56"></canvas><b>Cowok</b></button>
      </div>
      <div class="field"><label>Warna kulit</label>
        <div class="tones" id="tones"></div>
      </div>
      <div class="field"><label for="iName">Nama karakter</label><input id="iName" type="text" maxlength="14" autocomplete="off" spellcheck="false"></div>
      <div class="err" id="createErr" role="alert"></div>
      <button class="btn" id="createGo" type="button" style="width:100%">Mulai Petualangan</button>
    </div>
  </section>

  <div id="sheet" hidden>
    <div class="card sc">
      <div class="sh"><h2 id="sheetT"></h2><span id="sheetG"></span><button class="btn ghost sm" id="sheetX" type="button">Tutup</button></div>
      <div id="sheetB"></div>
    </div>
  </div>
  <div id="fade"></div>
</div>

    e.hit=Math.max(0,e.hit-dt);e.cd=Math.max(0,e.cd-dt);

    else if(e.cd<=0&&P.inv<=0){hurtPlayer(e.atk);e.cd=.9;if(D.over)return}
  }

  const pd=petDef();

    D.petT-=dt;
    if(D.petT<=0){let best=null,bd=80;for(const e of D.en){const d=Math.hypot(e.x-pet.x,e.y-pet.y);if(d<bd){bd=d;best=e}}

  }

  for(const f of D.fl){f.t-=dt;f.y-=16*dt}D.fl=D.fl.filter(f=>f.t>0);

  }

  $('btnA').hidden=dun;$('btnB').hidden=!dun;$('btnI').hidden=!dun;$('menuBtn').hidden=dun;$('exitBtn').hidden=!dun;$('dinfo').hidden=!dun;
  $('prompt').hidden=true;
  curS=dun?DS:TS;curW=dun?RW:TW;curH=dun?RH:TH;
}
function showScreen(id){for(const s of ['auth','create'])$(s).hidden=s!==id}
function showAuth(){S.mode='auth';$('ui').hidden=true;$('vig').hidden=true;showScreen('auth')}
function enterTown(){
  S.mode='town';showScreen('none');
  P.x=22*T;P.y=16*T+8;P.dir=0;pet.x=P.x;pet.y=P.y+8;
  setUiMode();updHud();toast('Selamat datang, '+S.save.name+'!');
}
function logout(){closeSheet();persist();S.user=null;S.save=null;D=null;$('iPass').value='';showAuth()}
let authMode='login';
function setAuthMode(m){authMode=m;$('tLogin').classList.toggle('on',m==='login');$('tReg').classList.toggle('on',m==='reg');$('fPass2').hidden=m==='login';$('authGo').textContent=m==='login'?'Masuk':'Daftar';$('authErr').textContent='';$('iPass').autocomplete=m==='login'?'current-password':'new-password'}
$('tLogin').addEventListener('click',()=>setAuthMode('login'));
$('tReg').addEventListener('click',()=>setAuthMode('reg'));
$('authGo').addEventListener('click',()=>{
  const u=$('iUser').value.trim().toLowerCase(),p=$('iPass').value,err=$('authErr');
  if(!/^[a-z0-9_]{3,16}$/.test(u)){err.textContent='Nama akun 3-16 karakter: huruf, angka, atau garis bawah.';return}
  if(p.length<4){err.textContent='Kata sandi minimal 4 karakter.';return}
  const us=users();
  if(authMode==='reg'){
    if($('iPass2').value!==p){err.textContent='Kata sandi tidak sama.';return}
    if(us[u]){err.textContent='Nama akun sudah dipakai.';return}
    us[u]={ph:hashPw(u,p),save:null};store.set(UK,us);S.user=u;S.save=null;startCreate();
  }else{
    if(!us[u]||us[u].ph!==hashPw(u,p)){err.textContent='Nama akun atau kata sandi salah.';return}
    S.user=u;S.save=us[u].save;err.textContent='';
    if(S.save){if(S.save.hp<=0)S.save.hp=maxHp();enterTown()}else startCreate();
  }
});
let cGender='f',cTone=0;
function drawCreate(){
  for(const [id,gd] of [['pF','f'],['pM','m']]){const c=$(id),q=c.getContext('2d');q.imageSmoothingEnabled=false;q.clearRect(0,0,48,56);drawPerson(q,24,50,0,0,lookOf({gender:gd,tone:cTone,skin:'dasar'}))}
  $('gF').classList.toggle('on',cGender==='f');$('gM').classList.toggle('on',cGender==='m');
  [...$('tones').children].forEach((b,i)=>b.classList.toggle('on',i===cTone));
}
function startCreate(){
  S.mode='create';showScreen('create');$('createErr').textContent='';$('iName').value='';
  const t=$('tones');t.replaceChildren();TONES.forEach((c,i)=>t.appendChild(E('button',{cls:'tone',type:'button','aria-label':'Warna kulit '+(i+1),style:'background:'+c,onclick:()=>{cTone=i;drawCreate()}})));
  drawCreate();
}
$('gF').addEventListener('click',()=>{cGender='f';drawCreate()});
$('gM').addEventListener('click',()=>{cGender='m';drawCreate()});
$('createGo').addEventListener('click',()=>{
  const n=$('iName').value.trim();
  if(n.length<2){$('createErr').textContent='Nama minimal 2 huruf.';return}
  S.save=newSave(n.slice(0,14),cGender,cTone);persist();enterTown();
});
function doAction(){if(S.mode!=='town'||S.sheet||S.busy||!near)return;near.fn()}
const labelOf=a=>typeof a.label==='function'?a.label():a.label;

/* ====================== update / render ====================== */
function followPet(dt){
  const f=FV[P.dir],tx=P.x-f[0]*14,ty=P.y-f[1]*10,dx=tx-pet.x,dy=ty-pet.y,d=Math.hypot(dx,dy);
  if(d>3){const sp=Math.min(d*4,90)*dt;pet.x+=dx/d*sp;pet.y+=dy/d*sp}
}
function updTown(dt){
  const [mx,my]=getMove();
  if(mx||my){P.dir=Math.abs(mx)>Math.abs(my)?(mx<0?2:3):(my<0?1:0);P.ft+=dt*9;moveEnt(P,mx*72*dt,my*72*dt,4,5)}else P.ft=0;
  P.st=(mx||my)?[0,1,0,3][Math.floor(P.ft)%4]:0;
  followPet(dt);
  let best=null,bd=1e9;
  for(const a of TIA){const d=Math.hypot(a.x-P.x,a.y-(P.y-4));if(d<a.r&&d<bd){bd=d;best=a}}
  near=best;
  const pr=$('prompt');
  if(near&&!S.sheet){const l=labelOf(near);if(pr.dataset.l!==l){pr.dataset.l=l;pr.replaceChildren(E('b',{text:'Aksi: '}),document.createTextNode(l))}pr.hidden=false}else pr.hidden=true;
}
function resize(){
  const w=$('app').clientWidth||innerWidth,h=$('app').clientHeight||innerHeight;
  SC=w<560?2:(w<1100?3:4);if(h<520)SC=Math.min(SC,2);
  VW=Math.ceil(w/SC);VH=Math.ceil(h/SC);cv.width=VW;cv.height=VH;cv.style.width=VW*SC+'px';cv.style.height=VH*SC+'px';g.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);
function camFor(WW,WH,fx,fy){
  let cx=fx-VW/2,cy=fy-VH*.45;
  cx=WW<=VW?-(VW-WW)/2:clamp(cx,0,WW-VW);cy=WH<=VH?-(VH-WH)/2:clamp(cy,0,WH-VH);
  return [Math.round(cx),Math.round(cy)];
}
function renderTown(t,showPlayer){
  g.drawImage(townLayer,0,0);
  const x0=Math.max(0,Math.floor(cam.x/T)),x1=Math.min(TW-1,Math.ceil((cam.x+VW)/T)),y0=Math.max(0,Math.floor(cam.y/T)),y1=Math.min(TH-1,Math.ceil((cam.y+VH)/T));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(TT[y][x]===1&&!(x>=7&&x<=9&&y<3)){const r=rnd(x,y,3),ph=t*1.2+r*6.28,ox=Math.floor((Math.sin(ph)+1)*4);g.fillStyle='rgba(190,255,245,.4)';g.fillRect(x*T+ox+1,y*T+Math.floor(r*10)+3,4,1);g.fillRect(x*T+((ox+7)%12)+1,y*T+Math.floor(r*7)+9,3,1)}
  }
  g.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<12;i++){const xx=7*T+i*4+1,yy=((t*55+i*13)%58)-8;g.fillRect(xx,Math.max(0,yy),2,Math.min(10,48-Math.max(0,yy)))}
  g.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<6;i++){g.fillRect(7*T+4+i*7+Math.sin(t*5+i)*2,5*T+8+Math.sin(t*3+i)*2,3,2)}
  if(S.save){PLOTS.forEach((p,i)=>{const pl=S.save.plots[i];if(!pl||!pl.s)return;const st=plotState(pl);for(const [ox,oy] of [[8,12],[24,12],[8,28],[24,28]])drawCrop(p.x*T+ox,p.y*T+oy,st.r,pl.s?SEEDS[pl.s].crop:'',t)})}
  const list=[];
  for(const o of TOBJ){if(o.x+o.w<cam.x-8||o.x>cam.x+VW+8||o.y<cam.y-8||o.y-o.h>cam.y+VH+8)continue;list.push(o)}
  if(showPlayer){
    list.push({y:P.y,d:()=>{
      if(P.inv>0&&Math.floor(S.t*20)%2)g.globalAlpha=.4;
      drawPerson(g,P.x,P.y,P.dir,P.st,lookOf(S.save));g.globalAlpha=1;
      const pd=petDef();
      }});
    const pd=petDef();if(pd)list.push({y:pet.y,d:()=>drawPet(g,pet.x,pet.y,pd.id,t)});
  }
  list.sort((a,b)=>a.y-b.y);
  for(const o of list)o.d(t);
  if(showPlayer&&near){g.fillStyle='rgba(255,255,255,.9)';const bx=Math.round(near.x),by=Math.round(near.y-26+Math.sin(t*6)*1.5);g.fillRect(bx-2,by,5,2);g.fillRect(bx-1,by+2,3,1);g.fillRect(bx,by+3,1,1)}
}
function renderDungeon(t){
  g.drawImage(DL,0,0);
  const list=[];
  for(const e of D.en)list.push({y:e.y,d:()=>drawEnemy(g,e,t)});
  list.push({y:P.y,d:()=>{
    if(P.inv>0&&Math.floor(S.t*20)%2)g.globalAlpha=.4;
    drawPerson(g,P.x,P.y,P.dir,P.st,lookOf(S.save));g.globalAlpha=1;
    if(D.atkT>0){
      const fv=FV[P.dir],k=1-D.atkT/.2,cx=P.x+fv[0]*14,cy=P.y-8+fv[1]*14;
      g.strokeStyle=wpn().col;g.lineWidth=3;g.beginPath();
      const a0=Math.atan2(fv[1],fv[0])-1.2+k*2.4;g.arc(P.x,P.y-8,17,a0-.5,a0+.5);g.stroke();
      g.fillStyle=wpn().col;g.fillRect(Math.round(cx)-1,Math.round(cy)-1,3,3);
    }}});
  const pd=petDef();if(pd)list.push({y:pet.y,d:()=>drawPet(g,pet.x,pet.y,pd.id,t)});
  list.sort((a,b)=>a.y-b.y);for(const o of list)o.d();
  for(const f of D.fx){g.strokeStyle='#fff6a8';g.lineWidth=2;g.beginPath();g.moveTo(f.x1,f.y1);g.lineTo(f.x2,f.y2);g.stroke()}
  g.font='700 8px "Pixelify Sans",monospace';g.textAlign='center';
  for(const f of D.fl){g.fillStyle='#000';g.fillText(f.txt,Math.round(f.x)+1,Math.round(f.y)+1);g.fillStyle=f.col;g.globalAlpha=Math.min(1,f.t*2);g.fillText(f.txt,Math.round(f.x),Math.round(f.y));g.globalAlpha=1}
}
function render(){
  g.fillStyle='#0d1a14';g.fillRect(0,0,VW,VH);
  const t=S.t;
  if(S.mode==='dungeon'&&D){
    const [cx,cy]=camFor(RW*T,RH*T,P.x,P.y);cam.x=cx;cam.y=cy;
    const sx=D.shake>0?Math.round((Math.random()-.5)*3):0,sy=D.shake>0?Math.round((Math.random()-.5)*3):0;
    g.save();g.translate(-cam.x+sx,-cam.y+sy);renderDungeon(t);g.restore();
  }else if(S.mode==='town'){
    const [cx,cy]=camFor(TW*T,TH*T,P.x,P.y);cam.x=cx;cam.y=cy;
    g.save();g.translate(-cam.x,-cam.y);renderTown(t,true);g.restore();
  }else{
    cam.x=clamp(Math.round(190+Math.sin(t*.12)*150-VW/2),0,Math.max(0,TW*T-VW));cam.y=clamp(Math.round(190+Math.cos(t*.09)*60-VH/2),0,Math.max(0,TH*T-VH));
    g.save();g.translate(-cam.x,-cam.y);renderTown(t,false);g.restore();
  }
}
let last=0,saveT=0,hudT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;S.t+=dt;
  if(!S.sheet&&!S.busy){if(S.mode==='town')updTown(dt);else if(S.mode==='dungeon'&&D)updDungeon(dt)}
  else if(S.mode==='town'&&S.sheet){$('prompt').hidden=true}
  hudT+=dt;if(hudT>.5){hudT=0;updHud()}
  saveT+=dt;if(saveT>12){saveT=0;persist()}
  render();requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',persist);
addEventListener('pagehide',persist);

/* ====================== boot ====================== */
resize();buildTown();setAuthMode('login');
try{const us=users();const names=Object.keys(us);if(names.length)$('iUser').value=names[names.length-1]}catch(e){}
showAuth();
requestAnimationFrame(frame);
})();
</script>
